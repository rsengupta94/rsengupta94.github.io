<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Not found</title>
<script>
  /* GitHub Pages serves this for any unknown path. Routing lives in the hash,
     so send visitors to the site root and keep whatever hash they arrived with. */
  location.replace('/' + location.hash);
</script>
</head>
<body>
<p>Redirecting to <a href="/">the home page</a>.</p>
</body>
</html>
